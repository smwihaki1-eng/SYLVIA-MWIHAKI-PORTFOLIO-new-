html.riding .beat:nth-of-type(even){animation-delay:.288s}
@keyframes beat{0%{scale:1.06}35%{scale:1}100%{scale:1}}
html.riding.bump #wrap{animation:jolt .38s cubic-bezier(.3,1.6,.5,1),sway 2.3s ease-in-out infinite .38s}
@keyframes sway{50%{transform:translateY(2px) rotate(.05deg)}}
@keyframes jolt{0%{transform:translateY(0)}30%{transform:translateY(-6px) rotate(-.15deg)}60%{transform:translateY(2px)}100%{transform:none}}
.radio.mini:not(:hover):not(:focus-visible) .rtxt{display:none}
.radio.mini:not(:hover):not(:focus-visible){padding-right:12px}
@media (prefers-reduced-motion: reduce){.radio .eq i,.radio .spk,html.riding #wrap,html.riding .beat{animation:none!important}}
@media (prefers-reduced-motion: reduce){.fmenu{transition:none;animation:none}.wcover,.cnav{transition:none}}
/* ---------- the spray can: sign the site ---------- */
#spray-layer{position:absolute;left:0;top:0;z-index:45;pointer-events:none}
html.spraying #spray-layer{pointer-events:auto;touch-action:none;cursor:crosshair}
html.spraying body{-webkit-user-select:none;user-select:none}
#spray-live{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:46;pointer-events:none}
.spraybtn{position:fixed;z-index:55;top:calc(env(safe-area-inset-top,0px) + 19px);right:calc(env(safe-area-inset-right,0px) + 152px);width:40px;height:40px;padding:0;border-radius:50%;border:2px solid #2A2530;background:#000;display:grid;place-items:center;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .2s}
.spraybtn:hover{transform:rotate(-12deg) scale(1.08);border-color:var(--pink)}
.spraybtn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
html.spraying .spraybtn{background:var(--lime);border-color:var(--ink);animation:canshake .5s ease-in-out 2}
@keyframes canshake{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.spraybar{position:fixed;z-index:57;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:calc(100vw - 24px);box-sizing:border-box;padding:7px 12px 9px;background:rgba(10,7,9,.94);border:3px solid var(--pink);border-radius:22px;box-shadow:6px 6px 0 #000;font-family:'Inter Tight',system-ui,sans-serif;color:#fff}
html.spraying .spraybar{display:flex}
.sb-h{font-family:'DotGothic16',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--led);text-align:center}
.sb-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px}
.sb-g{display:inline-flex;align-items:center;gap:7px}
.sb-c{width:24px;height:24px;padding:0;border-radius:50%;border:3px solid #0A0709;outline:2px solid #6a6470;cursor:pointer}
.sb-c[aria-pressed=true]{outline:3px solid #fff;transform:scale(1.12)}
.sb-n{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid #6a6470;background:transparent;display:grid;place-items:center;cursor:pointer}
.sb-n i{display:block;border-radius:50%;background:#fff}
.sb-n[aria-pressed=true]{border-color:var(--lime);background:#24202a}
.sb-a{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.12em}
.sb-a input{width:90px;accent-color:#FF3EA5}
.sb-t{height:30px;padding:0 11px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font:700 11px 'Inter Tight',sans-serif;letter-spacing:.08em;cursor:pointer}
.sb-t.done{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.sb-t:disabled{opacity:.35;cursor:default}
.sb-c:focus-visible,.sb-n:focus-visible,.sb-t:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@media (max-width:899px){.spraybtn{top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 134px);width:40px;height:40px}.spraybar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:8px 10px 10px}.sb-a input{width:90px}}
/* ---------- the prize at the last stop (in the footer) ---------- */
.prize{box-sizing:border-box;background:var(--lime);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--pink);font-family:'Inter Tight',system-ui,sans-serif;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px 16px 14px;text-align:left}
.prize::before,.prize::after{content:'';position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--ink)}
.prize::before{left:-10px}.prize::after{right:-10px}
.prize.dk{position:absolute;z-index:6;left:84px;top:118px;width:292px;transform:rotate(-5deg)}
.prize.ph{position:relative;width:min(300px,calc(100% - 24px));margin:10px auto 0;transform:rotate(-2deg)}
.pz-led{font-family:'DotGothic16',monospace;font-size:11px;letter-spacing:.14em;color:var(--led);background:#000;border-radius:4px;padding:3px 7px}
.pz-h{font-family:'Tumbler Karma',sans-serif;font-weight:400;font-size:24px;line-height:.95}
.prize p{margin:0;font-size:13px;line-height:1.4}
.pz-dl{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--lime);font-weight:700;font-size:13px;text-decoration:none}
.pz-dl:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.pz-stamp{position:absolute;right:14px;bottom:16px;border:2px solid #E8331B;color:#E8331B;border-radius:5px;padding:2px 6px;font-weight:800;font-size:10px;letter-spacing:.12em;transform:rotate(10deg) scale(2.2);opacity:0}
.prize.on .pz-stamp{animation:pzstamp .35s .3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pzstamp{to{transform:rotate(10deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion: reduce){.prize.on .pz-stamp{animation:none;opacity:.9;transform:rotate(10deg)}}
/* ---------- the makanga knock ---------- */
.knocked{animation:knock .55s ease-in-out}
@keyframes knock{20%{translate:-7px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:2px 0}}
.knockb{position:absolute;z-index:4;right:28px;top:50%;margin-top:-19px;background:#fff;color:#0A0709;border:3px solid #0A0709;border-radius:14px;padding:7px 12px 5px;font-family:'Tumbler Karma',sans-serif;font-size:20px;line-height:1;letter-spacing:.04em;white-space:nowrap;box-shadow:4px 4px 0 #FF3EA5;pointer-events:none;animation:kb 2.1s cubic-bezier(.3,1.6,.5,1) forwards}
.ph-stop .knockb{top:-6px;margin-top:0;right:16px;font-size:17px}
@keyframes kb{0%{transform:scale(0) rotate(-14deg)}14%{transform:scale(1.12) rotate(-5deg)}24%{transform:scale(1) rotate(-6deg)}82%{opacity:1;transform:scale(1) rotate(-6deg)}100%{opacity:0;transform:scale(.96) rotate(-6deg) translateY(-10px)}}
html.webkit .ph-ink,html.webkit canvas[style*="mix-blend-mode"]{display:none!important}
#stage canvas{animation:cvin .8s .2s both}
@keyframes cvin{from{opacity:0}}
/* ---------- night mode: when the music plays, the matatu's lights come on ---------- */
html.riding{--strip:linear-gradient(90deg,#FF3EA5,#D6F20B,#FFB01F,#B26BFF,#FF3EA5)}
html.riding body::before,html.riding body::after{content:'';position:fixed;z-index:44;top:0;bottom:0;width:5px;pointer-events:none;background:linear-gradient(180deg,#FF3EA5,#D6F20B,#FFB01F,#B26BFF,#FF3EA5) 0 0/100% 300%;box-shadow:0 0 18px 4px rgba(255,62,165,.55);animation:strip 3s linear infinite,glowc 2.3s ease-in-out infinite}
html.riding body::before{left:0}html.riding body::after{right:0;animation-direction:reverse,normal}
@keyframes strip{to{background-position:0 300%}}
@keyframes glowc{0%,100%{box-shadow:0 0 18px 4px rgba(255,62,165,.55)}33%{box-shadow:0 0 18px 4px rgba(214,242,11,.5)}66%{box-shadow:0 0 18px 4px rgba(178,107,255,.55)}}
html.riding::after{content:'';position:fixed;inset:0;z-index:43;pointer-events:none;background:radial-gradient(40vw 30vh at 15% 20%,rgba(255,62,165,.14),transparent 70%),radial-gradient(40vw 30vh at 85% 75%,rgba(214,242,11,.10),transparent 70%),radial-gradient(35vw 28vh at 70% 15%,rgba(178,107,255,.12),transparent 70%);animation:disco 6s ease-in-out infinite alternate}
@keyframes disco{0%{opacity:.6;transform:translateX(-3vw)}50%{opacity:1}100%{opacity:.7;transform:translateX(3vw)}}
/* underglow on every stop band */
html.riding .Homepage__band,html.riding .ph-stop{box-shadow:0 10px 30px -6px rgba(255,62,165,.7),0 -6px 24px -8px rgba(214,242,11,.5)}
html.riding .Homepage__band::after,html.riding .ph-stop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;background:linear-gradient(90deg,#FF3EA5,#D6F20B,#FFB01F,#B26BFF,#FF3EA5) 0 0/300% 100%;animation:stripx 2.4s linear infinite}
@keyframes stripx{to{background-position:300% 0}}
/* neon on the big type */
html.riding h1.beat,html.riding h2.beat,html.riding .ph-stop-t,html.riding .ph-foot-h{text-shadow:0 0 10px rgba(255,62,165,.9),0 0 26px rgba(255,62,165,.6),0 0 46px rgba(178,107,255,.45)}
/* the work glows */
html.riding .Kazi__card,html.riding .ph-cover,html.riding .ph-wtile,html.riding .wcard,html.riding .ph-card .ph-cover{box-shadow:0 0 0 3px #FF3EA5,0 0 28px 6px rgba(255,62,165,.55);animation:cardglow 1.15s ease-in-out infinite alternate}
@keyframes cardglow{to{box-shadow:0 0 0 3px #D6F20B,0 0 32px 8px rgba(214,242,11,.45)}}
html.riding .ph-ceil{animation-duration:.5s}
@media (prefers-reduced-motion: reduce){html.riding body::before,html.riding body::after,html.riding::after,html.riding .Homepage__band::after,html.riding .ph-stop::after,html.riding .Kazi__card,html.riding .ph-cover{animation:none!important}}

/* Homepage */
body{margin:0}
.Homepage__stopband{animation:Homepage__stopmarq 22s linear infinite}
@keyframes Homepage__stopmarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.Homepage__sec{position:relative}
@media (prefers-reduced-motion: reduce){.Homepage__stopband{animation:none}}
/* HeroInk */
body{margin:0}
.HeroInk__grain{background-image:url(b/50048f25a1946595cb331b628b37e9dd)}
.HeroInk__ltr{display:inline-block;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.HeroInk__pill{color:#0C0A10;text-decoration:none}
.HeroInk__pill:hover{background:#FFFFFF!important}
.HeroInk__mbtn{animation:HeroInk__mnudge 3.2s ease-in-out 1.2s 2}
@keyframes HeroInk__mnudge{0%,80%,100%{transform:none}84%{transform:rotate(-5deg) scale(1.06)}90%{transform:rotate(4deg) scale(1.06)}95%{transform:rotate(-2deg)}}
.HeroInk__marq{display:inline-flex;white-space:nowrap;animation:HeroInk__marq 60s linear infinite}
@keyframes HeroInk__marq{to{transform:translateX(-50%)}}
.HeroInk__lnk{color:#FFFFFF;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.HeroInk__lnk:hover{color:#D6F20B}
.HeroInk__hbtn{transition:transform .15s}
.HeroInk__hbtn:hover{transform:translate(-2px,-2px)}
.HeroInk__chip:hover{transform:scale(1.12)}
.HeroInk__wipe:hover{background:#FFFFFF!important;color:#0A0709!important}
.HeroInk__stk{touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .26s cubic-bezier(.3,1.7,.5,1),filter .2s}
.HeroInk__stk img{-webkit-user-drag:none;pointer-events:none}
.HeroInk__stk .HeroInk__face,.HeroInk__stk .HeroInk__flap{transition:clip-path .16s ease-out,transform .16s ease-out}
@media (prefers-reduced-motion: reduce){.HeroInk__marq,.HeroInk__mbtn{animation:none}}
/* Menu */
body{margin:0}
.Menu__grain{background-image:url(b/50048f25a1946595cb331b628b37e9dd)}
.Menu__mrow{color:#FFFFFF;text-decoration:none}
.Menu__mtick{animation:Menu__mtick 14s linear infinite}

    "Things we’ve made our own",

  "id": "loeries",

  "title": "Loeries 2026",
  "tag": "Fan the Flame. Burn Different.",
  "line": "The big idea, manifesto and look of the 2026 Loeries, the awards for creativity from Africa and the Middle East. Two directions built from one question: if this region already burns bright, what comes next? A pitch, and one of my favourite pieces of thinking.",
  "role": "Concept & art direction",
  "agency": "Agency: MB96 × the Qollective",
  "cover": "img/work/cover-loeries.webp",
  "coverBg": "#f7d117",
  "size": "",
  "behance": false,
  "sections": [
   [
    "The brief",
    "The whole awards platform",
    "The Loeries asked for more than a poster. They wanted the big idea for 2026, the manifesto, the look and feel, and how all of it would live through Creative Week, from the call for entries to what people wear on the night."
   ],
   [
    "The starting point",
    "We already burn bright",
    "The Loeries exists to celebrate the best creative work from Africa and the Middle East. We didn’t want an idea that tells the region it still needs to catch fire, because it already has. So the real question was: what do you do with a flame that’s already lit? The team answered it two ways."
   ],
   [
    "Direction 1",
    "Fan the Flame: burn brighter",
    "The first answer is growth. Fan the flame so it burns stronger, the way we push ourselves to become better creatives and make better work. The Loeries bird carries an inner glow, and the campaign is the act of fanning it. The treatment works like a heat sensor: heat-map colour picks up the warmth coming off the bird and the portraits, so you see the glow before you see the shape. That’s why it’s full colour and bright."
   ],
   [
    "Direction 2",
    "Burn Different: stand out in the fire",
    "The second answer is difference. If everyone is already burning, burn differently. It goes back to the classic image of the Loeries bird inside a flame, cut down to yellow and black, with a loud, warped typeface on lines like Want the Smoke? and No Flame No Glory."
   ],
   [
    "The applications",
    "Burn the media too",
    "For Burn Different, the idea had to live in the objects as well as the headline. What if the billboard was burnt? What if the T-shirts and merch came with burn marks? Every application was pushed through the same question, so you feel the idea before you read a word."
   ],
   [
    "My role",
    "Fan the Flame was my idea. I took it from the thought to the look: the inner glow, the heat-map treatment and the key visuals. On Burn Different I helped build the idea out. All of it was made together with MB96 and the Qollective."
   ]

    }, []);
    React.useEffect(function () { fit(); });
    var P = window.R254Pages, ph = React.useState(phone()), isPhone = ph[0], setPhone = ph[1];
    React.useEffect(function () { function rs() { setPhone(phone()); } window.addEventListener('resize', rs); return function () { window.removeEventListener('resize', rs); }; }, []);
    /* a light phone turned sideways gets the desktop layout, which needs the 3D after all */
    if (!isPhone && window.R254LITE) window.R254Load3D();
    if (isPhone && r === 'home') return h(window.R254Phone.Home);
    if (isPhone && r === 'wall') return h(window.R254Phone.Wall);
    if (r === 'wall') return h(WallPage);
    if (r === 'work') return h(P.WorkPage);
    if (r === 'about') return h(P.AboutPage);
    if (r.indexOf('case:') === 0) return h(P.CasePage, { id: r.slice(5), key: r });
    return h(DC.get('Homepage'));
  }

  /* links that don't go anywhere yet stay put instead of jumping to the top */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (href === '#') e.preventDefault();
    /* "back to the top" on an inner page stays on that page */
    else if (href === '#top' && route() !== 'home') { e.preventDefault(); window.scrollTo(0, 0); }
    /* clicking a link to the page you're already on still takes you to its top */
    else if (href === location.hash && href.length > 1) { e.preventDefault(); if (route() === 'home') jump(); else window.scrollTo(0, 0); }
  }, true);

  /* the floating menu, once you've scrolled past the hero */
  var open = false, mroot = ReactDOM.createRoot(document.getElementById('mlay-root'));
  function Overlay() {
    var vw = window.innerWidth, vh = window.innerHeight, small = vw < 900, s = small ? vw / 720 : Math.min(vw / 1440, vh / 900);
    return h('div', { className: 'mlay' + (small ? ' phone' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Menu' },
      h('div', { style: { transform: 'scale(' + s + ')', left: 0, top: 0, width: vw / s + 'px', height: vh / s + 'px' } },
        h(DC.get('Menu'), { onClose: close })));
  }
  function show() { open = true; mroot.render(h(Overlay)); document.body.style.overflow = 'hidden'; }
  function close() { open = false; mroot.render(null); document.body.style.overflow = ''; fbtn.focus(); }
  fbtn.addEventListener('click', show);
  window.__openMenu = show;
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) close(); });
  function onScroll() { fbtn.setAttribute('data-off', route() !== 'home' || phone() || window.scrollY > 700 * scale ? '0' : '1'); }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', function () { fit(); if (open) mroot.render(h(Overlay)); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  stage.innerHTML = '';
  ReactDOM.createRoot(stage).render(h(App));
  setTimeout(function () { fit(); if (location.hash) jump(); }, 60);
})();
</script>
